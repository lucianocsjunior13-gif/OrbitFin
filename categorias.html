<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitFin - Categorias</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modal styles for Nova Categoria */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        
        .modal-content {
            background-color: var(--branco);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            animation: modalFadeIn 0.3s ease-out;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-header h2 {
            margin: 0;
            color: var(--secundaria);
            font-size: 1.75rem;
        }
        
        .modal-close {
            color: var(--cinza-escuro);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .modal-close:hover {
            background-color: rgba(239,68,68,0.1);
            color: var(--vermelho);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--cinza-escuro);
            font-size: 0.95rem;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            background: var(--branco);
            color: var(--secundaria);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primaria);
            box-shadow: 0 0 0 2px rgba(224,86,56,0.2);
        }
        
        .icon-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            margin: 10px 0;
        }
        
        .icon-option {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }
        
        .icon-option:hover {
            background-color: #f1f5f9;
            transform: scale(1.05);
        }
        
        .icon-option.selected {
            border-color: var(--primaria);
            background-color: #eff6ff;
            transform: scale(1.05);
        }
        
        .icon-option i {
            font-size: 1.5rem;
            color: var(--cinza-escuro);
        }
        
        .btn-submit {
            background: var(--primaria);
            color: var(--branco);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-submit:hover {
            background: #c4452e;
        }
        
        .btn-cancel {
            background: #f3f4f6;
            color: var(--cinza-escuro);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-cancel:hover {
            background: #e5e7eb;
        }
        
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
            }
        }
        
        /* Category card styles */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .category-card {
            background: var(--branco);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #f1f5f9;
        }
        
        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border-color: #e2e8f0;
        }
        
        .category-card.despesa {
            border-left: 4px solid var(--vermelho);
        }
        
        .category-card.receita {
            border-left: 4px solid var(--verde);
        }
        
        .category-icon {
            width: 60px;
            height: 60px;
            background: var(--cinza-claro);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 25px auto 20px;
            flex-shrink: 0;
            border-radius: 12px;
        }
        
        .category-card.despesa .category-icon {
            background: #fef2f2;
        }
        
        .category-card.receita .category-icon {
            background: #dcfce7;
        }
        
        .category-icon i {
            color: var(--secundaria);
        }
        
        .category-card.despesa .category-icon i {
            color: var(--vermelho);
        }
        
        .category-card.receita .category-icon i {
            color: var(--verde);
        }
        
        .category-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 25px 25px;
        }
        
        .category-info h3 {
            margin: 0 0 12px;
            color: var(--secundaria);
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .category-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        
        .category-type.despesa {
            background: #fef2f2;
            color: var(--vermelho);
        }
        
        .category-type.receita {
            background: #dcfce7;
            color: var(--verde);
        }
        
        .category-budget {
            display: flex;
            flex-direction: column;
            margin-top: auto;
        }
        
        .budget-label {
            font-size: 0.9rem;
            color: var(--cinza-escuro);
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primaria);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        .category-card.despesa .progress-fill {
            background: var(--vermelho);
        }
        
        .category-card.receita .progress-fill {
            background: var(--verde);
        }
        
        .budget-value {
            font-weight: 600;
            font-size: 1.125rem;
            color: var(--secundaria);
        }
        
        .category-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 20px 25px;
            border-top: 1px solid #eee;
        }
        
        .action-btn.small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 0.875rem;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .action-btn.small.edit {
            background: #f0f9ff;
            color: #1e40af;
        }
        
        .action-btn.small.edit:hover {
            background: #dbeafe;
        }
        
        .action-btn.small.delete {
            background: #fef2f2;
            color: var(--vermelho);
        }
        
        .action-btn.small.delete:hover {
            background: #fee2e2;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--cinza-escuro);
            font-style: italic;
            grid-column: 1 / -1;
            font-size: 1.1rem;
        }
        
        /* Nova Categoria button */
        .nova-categoria {
            background: var(--primaria);
            color: var(--branco);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        
        .nova-categoria:hover {
            background: #c4452e;
        }
        
        /* Tabs styling - override if needed */
        .tab-btn {
            padding: 12px 20px;
            font-weight: 500;
        }
        
        .tab-btn.active {
            color: var(--primaria);
            font-weight: 600;
        }
        
        .tab-btn.active::after {
            height: 3px;
            background: var(--primaria);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo-container">
                <h2>OrbitFin</h2>
            </div>
            <div class="user-profile">
                <div class="avatar" id="sidebarAvatar">—</div>
                <div class="user-info">
                    <span class="name" id="sidebarName">—</span>
                    <span class="role">Usuário</span>
                </div>
            </div>
            <hr class="sidebar-divider">
            
            <!-- Menu Principal -->
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html"><i class="fi fi-br-home"></i> Visão Geral</a></li>
                    <li><a href="transacoes.html"><i class="fi fi-br-wallet"></i> Transações</a></li>
                    <li><a href="categorias.html" class="active"><i class="fi fi-br-apps"></i> Categorias</a></li>
                    <li><a href="metas.html"><i class="fi fi-br-target"></i> Metas</a></li>
                    <li><a href="relatorios.html"><i class="fi fi-br-chart-line-up"></i> Relatórios</a></li>
                </ul>
            </nav>
        </div>
        
        <!-- Menu Inferior (Configurações isoladas) -->
        <div class="sidebar-bottom">
            <hr class="sidebar-divider">
            <nav class="footer-nav">
                <ul>
                    <li><a href="configuracoes.html"><i class="fi fi-br-settings"></i> Configurações</a></li>
                </ul>
            </nav>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="content">
        <header class="page-header">
            <h1>Gerenciamento de Categorias</h1>
            <p>Organize seus gastos e receitas por classificações</p>
        </header>
        
        <div class="card">
            <div class="actions-header">
                <a href="#" class="action-btn nova-categoria" id="btnNovaCategoria"><i class="fi fi-br-plus"></i> Nova Categoria</a>
                <div class="filter-input">
                    <label for="catSearch">Buscar:</label>
                    <input type="text" id="catSearch" placeholder="Nome da categoria...">
                </div>
            </div>
        </div>
        
        <div class="card tabs-card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="despesas">Despesas</button>
                <button class="tab-btn" data-tab="receitas">Receitas</button>
            </div>
            <div class="tab-content">
                <div id="despesas" class="tab-pane active">
                    <div id="categoriesContainer" class="categories-grid">
                        <!-- Cards will be injected here -->
                    </div>
                </div>
                <div id="receitas" class="tab-pane">
                    <div id="categoriesContainer" class="categories-grid">
                        <!-- Cards will be injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Modal for Nova Categoria -->
    <div id="modalCategoria" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Categoria</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="formCategoria">
                <div class="form-group">
                    <label for="nomeCategoria">Nome da Categoria</label>
                    <input type="text" id="nomeCategoria" placeholder="Ex: Alimentação, Salário" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="tipoCategoria">Tipo</label>
                        <select id="tipoCategoria" required>
                            <option value="">Selecione o tipo</option>
                            <option value="despesa">Despesa</option>
                            <option value="receita">Receita</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="orcamentoCategoria">Orçamento Mensal (R$)</label>
                        <input type="number" id="orcamentoCategoria" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="iconeCategoria">Ícone da Categoria</label>
                    <div class="icon-options" id="iconOptions">
                        <!-- Icon options will be populated by JS -->
                    </div>
                    <input type="hidden" id="selectedIcon" value="fi fi-br-question">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn-submit"><i class="fi fi-br-plus"></i> Salvar Categoria</button>
                    <button type="button" class="btn-cancel" id="btnCancelCategoria">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/orbitfin-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const BASE_URL = 'https://x8ki-letl-twmt.n7.xano.io';
            const ENDPOINT = '/api:FODf7XFO/category';
            const token = localStorage.getItem('orbitfin_token');
            
            // Redirect to login if no token
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // preenche nome e avatar do sidebar com o usuario real
            OrbitFinUI.loadUserIdentity(BASE_URL, token);
            
            // Icon options for categories
            const iconOptions = [
                { name: 'Alimentação', icon: 'fi fi-br-utensils', emoji: '🍽️' },
                { name: 'Transporte', icon: 'fi fi-br-car', emoji: '🚗' },
                { name: 'Lazer', icon: 'fi fi-br-ticket', emoji: '🎮' },
                { name: 'Cartão', icon: 'fi fi-br-credit-card', emoji: '💳' },
                { name: 'Salário', icon: 'fi fi-br-wallet', emoji: '💰' },
                { name: 'Moradia', icon: 'fi fi-br-home', emoji: '🏠' },
                { name: 'Saúde', icon: 'fi fi-br-heart', emoji: '❤️' },
                { name: 'Educação', icon: 'fi fi-br-book', emoji: '📚' },
                { name: 'Assinaturas', icon: 'fi fi-br-layer', emoji: '📺' },
                { name: 'Investimentos', icon: 'fi fi-br-chart-line-up', emoji: '📈' },
                { name: 'Outros', icon: 'fi fi-br-question', emoji: '❓' }
            ];
            
            // Tab switching functionality
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remove active from all buttons
                    tabBtns.forEach(b => b.classList.remove('active'));
                    // Add active to clicked
                    this.classList.add('active');
                    // Hide all tab panes
                    document.querySelectorAll('.tab-pane').forEach(pane => {
                        pane.classList.remove('active');
                        pane.style.display = 'none';
                    });
                    // Show selected pane
                    const tabId = this.getAttribute('data-tab');
                    const activePane = document.getElementById(tabId);
                    if (activePane) {
                        activePane.classList.add('active');
                        activePane.style.display = 'block';
                    }
                    // Re-render categories for the active tab with current search filter
                    renderCategories();
                });
            });
            
            // Modal elements
            const modalCategoria = document.getElementById('modalCategoria');
            const btnNovaCategoria = document.getElementById('btnNovaCategoria');
            const btnCancelCategoria = document.getElementById('btnCancelCategoria');
            const closeModalSpans = document.getElementsByClassName('modal-close');
            
            // Open modal
            btnNovaCategoria.onclick = () => {
                modalCategoria.style.display = 'block';
                // Reset form and icon selection
                document.getElementById('formCategoria').reset();
                document.getElementById('selectedIcon').value = 'fi fi-br-question';
                renderIconOptions();
                // Set focus to first input
                document.getElementById('nomeCategoria').focus();
            };
            
            // Close modals when clicking on (x)
            for (let span of closeModalSpans) {
                span.onclick = function() {
                    modalCategoria.style.display = 'none';
                    document.getElementById('formCategoria').reset();
                };
            }
            
            // Close modals when clicking outside
            window.onclick = function(event) {
                if (event.target === modalCategoria) {
                    modalCategoria.style.display = 'none';
                    document.getElementById('formCategoria').reset();
                }
            };
            
            // Handle form submission for new category
            document.getElementById('formCategoria').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const categoryData = {
                    name: document.getElementById('nomeCategoria').value.trim(),
                    type: document.getElementById('tipoCategoria').value,
                    icon: document.getElementById('selectedIcon').value,
                    budget: parseFloat(document.getElementById('orcamentoCategoria').value) || 0
                };
                
                // Validate required fields
                if (!categoryData.name || !categoryData.type) {
                    alert('Por favor, preencha todos os campos obrigatórios');
                    return;
                }
                
                try {
                    const response = await fetch(`${BASE_URL}${ENDPOINT}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(categoryData)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Close modal and refresh categories
                        modalCategoria.style.display = 'none';
                        document.getElementById('formCategoria').reset();
                        loadAndRenderCategories(); // Reload the list
                        alert('Categoria adicionada com sucesso!');
                    } else {
                        throw new Error(data.message || 'Erro ao salvar categoria');
                    }
                } catch (error) {
                    console.error('Erro ao salvar categoria:', error);
                    alert(error.message || 'Erro de conexão com o servidor');
                }
            });
            
            // Search input functionality
            document.getElementById('catSearch').addEventListener('input', () => {
                renderCategories(); // Re-render with current filter
            });
            
            // Function to load categories from Xano
            async function loadCategories() {
                try {
                    const response = await fetch(`${BASE_URL}${ENDPOINT}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to fetch categories');
                    }
                    
                    const categories = await response.json();
                    return categories;
                } catch (error) {
                    console.error('Erro ao carregar categorias:', error);
                    throw error;
                }
            }
            
            // Function to render icon options in modal
            function renderIconOptions() {
                const iconOptionsContainer = document.getElementById('iconOptions');
                iconOptionsContainer.innerHTML = '';
                
                iconOptions.forEach(option => {
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'icon-option';
                    iconDiv.innerHTML = `<i class="${option.icon}"></i>`;
                    iconDiv.title = option.name;
                    
                    // Check if this icon is currently selected
                    if (option.icon === document.getElementById('selectedIcon').value) {
                        iconDiv.classList.add('selected');
                    }
                    
                    iconDiv.addEventListener('click', () => {
                        // Remove selected class from all options
                        iconOptionsContainer.querySelectorAll('.icon-option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        // Add selected class to clicked option
                        iconDiv.classList.add('selected');
                        // Update hidden input
                        document.getElementById('selectedIcon').value = option.icon;
                    });
                    
                    iconOptionsContainer.appendChild(iconDiv);
                });
            }
            
            // Function to render categories in the grids
            function renderCategories() {
                // Get active tab
                const activeTab = document.querySelector('.tab-btn.active').getAttribute('data-tab');
                const isDespesasTab = activeTab === 'despesa';
                
                // Get search term
                const searchTerm = document.getElementById('catSearch').value.toLowerCase().trim();
                
                // We'll load categories and then filter/render
                loadCategories().then(categories => {
                    // Filter by type and search term
                    const filteredCategories = categories.filter(cat => {
                        const typeMatch = isDespesasTab ? cat.type === 'despesa' : cat.type === 'receita';
                        const searchMatch = cat.name.toLowerCase().includes(searchTerm);
                        return typeMatch && searchMatch;
                    });
                    
                    // Get the container for active tab
                    const container = isDespesasTab ? 
                        document.getElementById('despesas').querySelector('.categories-grid') : 
                        document.getElementById('receitas').querySelector('.categories-grid');
                    
                    // Clear container
                    container.innerHTML = '';
                    
                    if (filteredCategories.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                Nenhuma ${isDespesasTab ? 'despesa' : 'receita'} cadastrada nesta aba.
                            </div>
                        `;
                        return;
                    }
                    
                    // Create and append cards
                    filteredCategories.forEach(category => {
                        const card = document.createElement('div');
                        card.className = `category-card ${category.type}`;
                        
                        // Format budget as Brazilian currency
                        const budgetValue = new Intl.NumberFormat('pt-BR', {
                            style: 'currency',
                            currency: 'BRL'
                        }).format(category.budget || 0);
                        
                        // Determine progress width (simple visualization based on budget)
                        const progressWidth = Math.min(Math.max((category.budget || 0) / 10000 * 100, 0), 100);
                        
                        card.innerHTML = `
                            <div class="category-icon">
                                <i class="${category.icon || 'fi fi-br-question'}"></i>
                            </div>
                            <div class="category-info">
                                <h3>${escapeHtml(category.name)}</h3>
                                <span class="category-type ${category.type}">${category.type === 'despesa' ? 'Despesa' : 'Receita'}</span>
                            </div>
                            <div class="category-budget">
                                <span class="budget-label">Orçamento mensal</span>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progressWidth}%;"></div>
                                </div>
                                <span class="budget-value">${budgetValue}</span>
                            </div>
                            <div class="category-actions">
                                <a href="#" class="action-btn small edit" data-id="${category.id}">Editar</a>
                                <a href="#" class="action-btn small delete" data-id="${category.id}">Excluir</a>
                            </div>
                        `;
                        
                        // Add event listeners for edit/delete buttons (placeholder for now)
                        card.querySelector('.edit').addEventListener('click', (e) => {
                            e.preventDefault();
                            alert('Funcionalidade de edição em desenvolvimento');
                        });
                        
                        card.querySelector('.delete').addEventListener('click', (e) => {
                            e.preventDefault();
                            if (confirm(`Tem certeza que deseja excluir a categoria "${category.name}"?`)) {
                                deleteCategory(category.id);
                            }
                        });
                        
                        container.appendChild(card);
                    });
                }).catch(error => {
                    console.error('Erro ao renderizar categorias:', error);
                    const container = document.querySelector('.tab-pane.active .categories-grid');
                    container.innerHTML = `
                        <div class="empty-state" style="color: var(--vermelho);">
                            Erro ao carregar categorias: ${error.message}
                        </div>
                    `;
                });
            }
            
            // Function to delete a category
            async function deleteCategory(categoryId) {
                try {
                    const response = await fetch(`${BASE_URL}${ENDPOINT}/${categoryId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to delete category');
                    }
                    
                    // Reload categories after deletion
                    loadAndRenderCategories();
                    alert('Categoria excluída com sucesso!');
                } catch (error) {
                    console.error('Erro ao excluir categoria:', error);
                    alert(error.message || 'Erro ao excluir categoria');
                }
            }
            
            // Function to load and render categories (used after add/delete)
            function loadAndRenderCategories() {
                renderCategories();
            }
            
            // Helper function to escape HTML to prevent XSS
            function escapeHtml(text) {
                const map = {
                    '&': '&',
                    '<': '<',
                    '>': '>',
                    '"': '"',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
            
            // Initial load
            loadAndRenderCategories();
        });
    </script>
</body>
</html>
