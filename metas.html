<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitFin - Metas</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modal styles for Nova Meta */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        
        .modal-content {
            background-color: var(--branco);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            animation: modalFadeIn 0.3s ease-out;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-header h2 {
            margin: 0;
            color: var(--secundaria);
            font-size: 1.75rem;
        }
        
        .modal-close {
            color: var(--cinza-escuro);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .modal-close:hover {
            background-color: rgba(239,68,68,0.1);
            color: var(--vermelho);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--cinza-escuro);
            font-size: 0.95rem;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            background: var(--branco);
            color: var(--secundaria);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primaria);
            box-shadow: 0 0 0 2px rgba(224,86,56,0.2);
        }
        
        .icon-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            margin: 10px 0;
        }
        
        .icon-option {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }
        
        .icon-option:hover {
            background-color: #f1f5f9;
            transform: scale(1.05);
        }
        
        .icon-option.selected {
            border-color: var(--primaria);
            background-color: #eff6ff;
            transform: scale(1.05);
        }
        
        .icon-option i {
            font-size: 1.5rem;
            color: var(--cinza-escuro);
        }
        
        .btn-submit {
            background: var(--primaria);
            color: var(--branco);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-submit:hover {
            background: #c4452e;
        }
        
        .btn-cancel {
            background: #f3f4f6;
            color: var(--cinza-escuro);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-cancel:hover {
            background: #e5e7eb;
        }
        
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
            }
        }
        
        /* Goals card styles */
        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .goal-card {
            background: var(--branco);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #f1f5f9;
        }
        
        .goal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border-color: #e2e8f0;
        }
        
        .goal-icon {
            width: 60px;
            height: 60px;
            background: var(--cinza-claro);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 25px auto 20px;
            flex-shrink: 0;
            border-radius: 12px;
        }
        
        .goal-icon i {
            color: var(--secundaria);
        }
        
        .goal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 25px;
        }
        
        .goal-info h3 {
            margin: 0 0 12px;
            color: var(--secundaria);
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .goal-description {
            color: var(--cinza-escuro);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .goal-progress {
            margin-top: auto;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--cinza-escuro);
        }
        
        .progress-percent {
            font-weight: 600;
            color: var(--primaria);
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: var(--primaria);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        .goal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 20px 25px;
            border-top: 1px solid #eee;
        }
        
        .action-btn.small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 0.875rem;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .action-btn.small.edit {
            background: #f0f9ff;
            color: #1e40af;
        }
        
        .action-btn.small.edit:hover {
            background: #dbeafe;
        }
        
        .action-btn.small.delete {
            background: #fef2f2;
            color: var(--vermelho);
        }
        
        .action-btn.small.delete:hover {
            background: #fee2e2;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--cinza-escuro);
            font-style: italic;
            grid-column: 1 / -1;
            font-size: 1.1rem;
        }
        
        /* Nova Meta button */
        .nova-meta {
            background: var(--primaria);
            color: var(--branco);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        
        .nova-meta:hover {
            background: #c4452e;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo-container">
                <h2>OrbitFin</h2>
            </div>
            <div class="user-profile">
                <div class="avatar" id="sidebarAvatar">—</div>
                <div class="user-info">
                    <span class="name" id="sidebarName">—</span>
                    <span class="role">Usuário</span>
                </div>
            </div>
            <hr class="sidebar-divider">
            
            <!-- Menu Principal -->
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html"><i class="fi fi-br-home"></i> Visão Geral</a></li>
                    <li><a href="transacoes.html"><i class="fi fi-br-wallet"></i> Transações</a></li>
                    <li><a href="categorias.html"><i class="fi fi-br-apps"></i> Categorias</a></li>
                    <li><a href="metas.html" class="active"><i class="fi fi-br-target"></i> Metas</a></li>
                    <li><a href="relatorios.html"><i class="fi fi-br-chart-line-up"></i> Relatórios</a></li>
                </ul>
            </nav>
        </div>
        
        <!-- Menu Inferior (Configurações isoladas) -->
        <div class="sidebar-bottom">
            <hr class="sidebar-divider">
            <nav class="footer-nav">
                <ul>
                    <li><a href="configuracoes.html"><i class="fi fi-br-settings"></i> Configurações</a></li>
                </ul>
            </nav>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="content">
        <header class="page-header">
            <h1>Acompanhamento de Metas</h1>
        </header>
        
        <div class="card">
            <div class="actions-header">
                <a href="#" class="action-btn nova-meta" id="btnNovaMeta"><i class="fi fi-br-plus"></i> Nova Meta</a>
                <div class="filter-input">
                    <label for="metaSearch">Buscar:</label>
                    <input type="text" id="metaSearch" placeholder="Nome da meta...">
                </div>
            </div>
        </div>
        
        <div id="goalsContainer" class="goals-grid">
            <!-- Goals will be injected here -->
        </div>
    </main>
    
    <!-- Modal for Nova Meta -->
    <div id="modalMeta" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nova Meta</h2>
                <span class="modal-close">&times;</span>
            </div>
            <form id="formMeta">
                <div class="form-group">
                    <label for="tituloMeta">Título/Nome da Meta</label>
                    <input type="text" id="tituloMeta" placeholder="Ex: Reserva de Emergência" required>
                </div>
                <div class="form-group">
                    <label for="descricaoMeta">Descrição/Objetivo</label>
                    <textarea id="descricaoMeta" rows="3" placeholder="Ex: Para imprevistos e segurança financeira"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="valorAlvoMeta">Valor Alvo (Total) (R$)</label>
                        <input type="number" id="valorAlvoMeta" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="valorAtualMeta">Valor Atual (Guardado) (R$)</label>
                        <input type="number" id="valorAtualMeta" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="dataLimiteMeta">Data Limite/Prazo</label>
                    <input type="date" id="dataLimiteMeta" required>
                </div>
                <div class="form-group">
                    <label for="iconeMeta">Ícone da Meta</label>
                    <div class="icon-options" id="iconOptions">
                        <!-- Icon options will be populated by JS -->
                    </div>
                    <input type="hidden" id="selectedIcon" value="fi fi-br-piggy-bank">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-submit"><i class="fi fi-br-plus"></i> Salvar Meta</button>
                    <button type="button" class="btn-cancel" id="btnCancelMeta">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/orbitfin-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const BASE_URL = 'https://x8ki-letl-twmt.n7.xano.io';
            const ENDPOINT = '/api:FODf7XFO/goal'; // Assuming goal endpoint; adjust if different
            const token = localStorage.getItem('orbitfin_token');
            
            // Redirect to login if no token
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // preenche nome e avatar do sidebar com o usuario real
            OrbitFinUI.loadUserIdentity(BASE_URL, token);
            
            // Icon options for goals
            const iconOptions = [
                { name: 'Cofrinho', icon: 'fi fi-br-piggy-bank', emoji: '🐷' },
                { name: 'Viagem', icon: 'fi fi-br-plane', emoji: '✈️' },
                { name: 'Setup', icon: 'fi fi-br-laptop', emoji: '💻' },
                { name: 'Imóvel', icon: 'fi fi-br-home', emoji: '🏠' },
                { name: 'Carro', icon: 'fi fi-br-car', emoji: '🚗' },
                { name: 'Educação', icon: 'fi fi-br-book', emoji: '📚' },
                { name: 'Emergência', icon: 'fi fi-br-shield-alt', emoji: '🛡️' },
                { name: 'Liberdade Financeira', icon: 'fi fi-br-chart-line-up', emoji: '💰' },
                { name: 'Outros', icon: 'fi fi-br-question', emoji: '❓' }
            ];
            
            // Function to load goals from Xano
            async function loadGoals() {
                try {
                    const response = await fetch(`${BASE_URL}${ENDPOINT}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to fetch goals');
                    }
                    
                    const goals = await response.json();
                    return goals;
                } catch (error) {
                    console.error('Erro ao carregar metas:', error);
                    throw error;
                }
            }
            
            // Function to render icon options in modal
            function renderIconOptions() {
                const iconOptionsContainer = document.getElementById('iconOptions');
                iconOptionsContainer.innerHTML = '';
                
                iconOptions.forEach(option => {
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'icon-option';
                    iconDiv.innerHTML = `<i class="${option.icon}"></i>`;
                    iconDiv.title = option.name;
                    
                    // Check if this icon is currently selected
                    if (option.icon === document.getElementById('selectedIcon').value) {
                        iconDiv.classList.add('selected');
                    }
                    
                    iconDiv.addEventListener('click', () => {
                        // Remove selected class from all options
                        iconOptionsContainer.querySelectorAll('.icon-option').forEach(opt => {
                            opt.classList.remove('selected');
                        });
                        // Add selected class to clicked option
                        iconDiv.classList.add('selected');
                        // Update hidden input
                        document.getElementById('selectedIcon').value = option.icon;
                    });
                    
                    iconOptionsContainer.appendChild(iconDiv);
                });
            }
            
            // Function to render goals in the grid
            function renderGoals() {
                const container = document.getElementById('goalsContainer');
                
                loadGoals().then(goals => {
                    // Get search term
                    const searchTerm = document.getElementById('metaSearch').value.toLowerCase().trim();
                    
                    // Filter goals by search term
                    const filteredGoals = goals.filter(goal => 
                        goal.name.toLowerCase().includes(searchTerm)
                    );
                    
                    // Clear container
                    container.innerHTML = '';
                    
                    if (filteredGoals.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                Nenhuma meta encontrada.
                            </div>
                        `;
                        return;
                    }
                    
                    // Create and append goal cards
                    filteredGoals.forEach(goal => {
                        const card = document.createElement('div');
                        card.className = 'goal-card';
                        
                        // Calculate progress percentage
                        const targetValue = parseFloat(goal.target_value) || 0;
                        const currentValue = parseFloat(goal.current_value) || 0;
                        const progressPercent = targetValue > 0 ? Math.min((currentValue / targetValue) * 100, 100) : 0;
                        
                        // Format currency values
                        const formatCurrency = (value) => 
                            new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
                        
                        card.innerHTML = `
                            <div class="goal-icon">
                                <i class="${goal.icon || 'fi fi-br-question'}"></i>
                            </div>
                            <div class="goal-info">
                                <h3>${escapeHtml(goal.name)}</h3>
                                <p class="goal-description">${escapeHtml(goal.description || '')}</p>
                            </div>
                            <div class="goal-progress">
                                <div class="progress-label">
                                    <span>R$ ${formatCurrency(currentValue)} / R$ ${formatCurrency(targetValue)}</span>
                                    <span class="progress-percent">${Math.round(progressPercent)}%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progressPercent}%;"></div>
                                </div>
                            </div>
                            <div class="goal-actions">
                                <a href="#" class="action-btn small edit" data-id="${goal.id}">Editar</a>
                                <a href="#" class="action-btn small delete" data-id="${goal.id}">Excluir</a>
                            </div>
                        `;
                        
                        // Add event listeners for edit/delete buttons (placeholder for now)
                        card.querySelector('.edit').addEventListener('click', (e) => {
                            e.preventDefault();
                            alert('Funcionalidade de edição em desenvolvimento');
                        });
                        
                        card.querySelector('.delete').addEventListener('click', (e) => {
                            e.preventDefault();
                            if (confirm(`Tem certeza que deseja excluir a meta "${goal.name}"?`)) {
                                deleteGoal(goal.id);
                            }
                        });
                        
                        container.appendChild(card);
                    });
                }).catch(error => {
                    console.error('Erro ao renderizar metas:', error);
                    container.innerHTML = `
                        <div class="empty-state" style="color: var(--vermelho);">
                            Erro ao carregar metas: ${error.message}
                        </div>
                    `;
                });
            }
            
            // Function to delete a goal
            async function deleteGoal(goalId) {
                try {
                    const response = await fetch(`${BASE_URL}${ENDPOINT}/${goalId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to delete goal');
                    }
                    
                    // Reload goals after deletion
                    loadAndRenderGoals();
                    alert('Meta excluída com sucesso!');
                } catch (error) {
                    console.error('Erro ao excluir meta:', error);
                    alert(error.message || 'Erro ao excluir meta');
                }
            }
            
            // Function to load and render goals (used after add/delete)
            function loadAndRenderGoals() {
                renderGoals();
            }
            
            // Modal elements
            const modalMeta = document.getElementById('modalMeta');
            const btnNovaMeta = document.getElementById('btnNovaMeta');
            const btnCancelMeta = document.getElementById('btnCancelMeta');
            const closeModalSpans = document.getElementsByClassName('modal-close');
            
            // Open modal
            btnNovaMeta.onclick = () => {
                modalMeta.style.display = 'block';
                // Reset form and icon selection
                document.getElementById('formMeta').reset();
                document.getElementById('selectedIcon').value = 'fi fi-br-piggy-bank';
                renderIconOptions();
                // Set focus to first input
                document.getElementById('tituloMeta').focus();
            };
            
            // Close modals when clicking on (x)
            for (let span of closeModalSpans) {
                span.onclick = function() {
                    modalMeta.style.display = 'none';
                    document.getElementById('formMeta').reset();
                };
            }
            
            // Close modals when clicking outside
            window.onclick = function(event) {
                if (event.target === modalMeta) {
                    modalMeta.style.display = 'none';
                    document.getElementById('formMeta').reset();
                }
            };
            
            // Handle form submission for new goal
            document.getElementById('formMeta').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const goalData = {
                    name: document.getElementById('tituloMeta').value.trim(),
                    description: document.getElementById('descricaoMeta').value.trim(),
                    target_value: parseFloat(document.getElementById('valorAlvoMeta').value) || 0,
                    current_value: parseFloat(document.getElementById('valorAtualMeta').value) || 0,
                    deadline: document.getElementById('dataLimiteMeta').value,
                    icon: document.getElementById('selectedIcon').value
                };
                
                // Validate required fields
                if (!goalData.name) {
                    alert('Por favor, preencha o título da meta');
                    return;
                }
                
                try {
                    const response = await fetch(`${BASE_URL}${ENDPOINT}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(goalData)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Close modal and refresh goals
                        modalMeta.style.display = 'none';
                        document.getElementById('formMeta').reset();
                        loadAndRenderGoals(); // Reload the list
                        alert('Meta adicionada com sucesso!');
                    } else {
                        throw new Error(data.message || 'Erro ao salvar meta');
                    }
                } catch (error) {
                    console.error('Erro ao salvar meta:', error);
                    alert(error.message || 'Erro de conexão com o servidor');
                }
            });
            
            // Search input functionality
            document.getElementById('metaSearch').addEventListener('input', () => {
                renderGoals(); // Re-render with current filter
            });
            
            // Helper function to escape HTML to prevent XSS
            function escapeHtml(text) {
                const map = {
                    '&': '&',
                    '<': '<',
                    '>': '>',
                    '"': '"',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
            
            // Initial load
            loadAndRenderGoals();
        });
    </script>
</body>
</html>
