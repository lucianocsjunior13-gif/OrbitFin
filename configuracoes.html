<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitFin - Configurações</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo-container">
                <h2>OrbitFin</h2>
            </div>
            <div class="user-profile">
                <div class="avatar">LJ</div>
                <div class="user-info">
                    <span class="name">Luciano Junior</span>
                    <span class="role">Usuário</span>
                </div>
            </div>
            <hr class="sidebar-divider">
            
            <!-- Menu Principal -->
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html"><i class="fi fi-br-home"></i> Visão Geral</a></li>
                    <li><a href="transacoes.html"><i class="fi fi-br-wallet"></i> Transações</a></li>
                    <li><a href="categorias.html"><i class="fi fi-br-apps"></i> Categorias</a></li>
                    <li><a href="metas.html"><i class="fi fi-br-target"></i> Metas</a></li>
                    <li><a href="relatorios.html"><i class="fi fi-br-chart-line-up"></i> Relatórios</a></li>
                </ul>
            </nav>
        </div>

        <!-- Menu Inferior (Configurações isoladas) -->
        <div class="sidebar-bottom">
            <hr class="sidebar-divider">
            <nav class="footer-nav">
                <ul>
                    <li><a href="configuracoes.html" class="ativo"><i class="fi fi-br-settings"></i> Configurações</a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
                <header class="page-header">
            <h1>Tela de Configurações</h1>
            <p>Gerencie sua conta e preferências</p>
        </header>

        <div class="config-grid">
            <div class="card config-card">
                <div class="config-header">
                    <h3>Perfil</h3>
                </div>
                <div class="config-body">
                    <div class="config-item">
                        <label class="config-label">Nome:</label>
                        <span class="config-value">Luciano Junior</span>
                    </div>
                    <div class="config-item">
                        <label class="config-label">E-mail:</label>
                        <span class="config-value">luciano@orbitfin.com</span>
                    </div>
                    <div class="config-item">
                        <button type="button" class="card-action-btn">Editar Perfil</button>
                    </div>
                </div>
            </div>

            <div class="card config-card">
                <div class="config-header">
                    <h3>Preferências</h3>
                </div>
                <div class="config-body">
                    <div class="config-item">
                        <label class="config-label">Moeda padrão:</label>
                        <select class="config-select">
                            <option value="BRL">BRL - Real Brasileiro</option>
                            <option value="USD">USD - Dólar Americano</option>
                            <option value="EUR">EUR - Euro</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label class="config-label">Notificações por e-mail:</label>
                        <div class="config-switch">
                            <input type="checkbox" id="emailNotif" checked>
                            <label for="emailNotif"></label>
                        </div>
                    </div>
                    <div class="config-item">
                        <label class="config-label">Tema visual:</label>
                        <select class="config-select">
                            <option value="light">Claro</option>
                            <option value="dark" selected>Escuro</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card config-card">
                <div class="config-header">
                    <h3>Segurança</h3>
                </div>
                <div class="config-body">
                    <div class="config-item">
                        <button type="button" class="card-action-btn">Alterar Senha</button>
                    </div>
                    <div class="config-item">
                        <label class="config-label">Sessões ativas:</label>
                        <span class="config-value">2 dispositivos</span>
                    </div>
                    <div class="config-item">
                        <button type="button" class="card-action-btn">Gerenciar Sessões</button>
                    </div>
                </div>
            </div>
        </div>

        
    
        <div class="global-action">
            <a href="#" class="action-btn salvar-config"><i class="fi fi-br-save"></i> Salvar Configurações</a>
        </div>
</main>


</html>
</body>
