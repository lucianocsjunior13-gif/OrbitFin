<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitFin - Criar Conta</title>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Criar Conta</h2>
                <p>Comece a organizar suas finanças com o OrbitFin</p>
            </div>
            <form id="signupForm" class="login-form">
                <div class="form-group">
                    <label for="firstName">Nome</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Sobrenome</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Seu sobrenome" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
                <p class="login-footer">
                    Já tem uma conta? <a href="login.html">Entre aqui</a>
                </p>
            </form>
            <div id="signupError" class="error-message" style="color: var(--vermelho); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem;"></div>
        </div>
    </div>
    <script>
        const BASE_URL = 'https://x8ki-letl-twmt.n7.xano.io';

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorDiv = document.getElementById('signupError');
            errorDiv.textContent = '';

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Password match validation
            if (password !== confirmPassword) {
                errorDiv.textContent = 'As senhas não coincidem. Verifique e tente novamente';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/api:FODf7XFO/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        cpf,
                        phone,
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('orbitfin_token', data.authToken);
                    window.location.href = 'index.html';
                } else {
                    // Friendly error message for signup failures
                    errorDiv.textContent = 'E-mail já cadastrado ou dados inválidos';
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                errorDiv.textContent = 'Erro de conexão com o servidor do Xano.';
            }
        });
    </script>
</body>
</html>
